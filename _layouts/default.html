<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url != "/" and page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="theme-color" content="#24325c">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% if page.url != '/' and page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:image" content="{{ site.url }}/assets/banner.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="/assets/avatar.png">
  <style>
    :root {
      --bg: #1a2547;
      --surface: #24325c;
      --card: #2c3c6e;
      --border: #3b4c82;
      --text: #eef1f8;
      --muted: #c3cce6;
      --accent: #ffd34d;
      --accent-text: #1a2547;
      --blue: #2f5cd6;
      --red: #e8394a;
      --link: #9fc0ff;
      --radius: 14px;
      --max: 1040px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    }
    a { color: var(--link); }
    a:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    img { max-width: 100%; height: auto; }
    code {
      font: 0.9em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: rgba(255, 255, 255, 0.08);
      padding: 0.1em 0.4em;
      border-radius: 6px;
    }

    .skip { position: absolute; left: -9999px; }
    .skip:focus { left: 16px; top: 16px; z-index: 10; background: var(--accent); color: var(--accent-text); padding: 8px 14px; border-radius: 8px; }

    .tricolore { height: 6px; background: linear-gradient(90deg, var(--blue) 0 33.33%, #fff 33.33% 66.66%, var(--red) 66.66%); }
    .wrap { max-width: var(--max); margin: 0 auto; padding: 0 20px; }

    .site-header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 16px; padding-bottom: 16px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font-weight: 700; font-size: 1.15rem; }
    .brand img { border-radius: 50%; }
    .site-nav { display: flex; gap: 6px 20px; flex-wrap: wrap; }
    .site-nav a { color: var(--muted); text-decoration: none; font-size: 0.95rem; }
    .site-nav a:hover, .site-nav a[aria-current="page"] { color: var(--text); text-decoration: underline; }

    .btn {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 13px 22px; border-radius: 999px;
      font-weight: 700; text-decoration: none; border: 2px solid transparent;
    }
    .btn-primary { background: var(--accent); color: var(--accent-text); }
    .btn-primary:hover { background: #ffe07f; }
    .btn-ghost { color: var(--text); border-color: var(--border); }
    .btn-ghost:hover { border-color: var(--muted); }

    /* Accueil */
    .hero { padding: 56px 0 40px; display: grid; gap: 40px; grid-template-columns: 1.1fr 1fr; align-items: center; }
    .hero h1 { font-size: clamp(2.2rem, 5vw, 3.4rem); line-height: 1.1; margin: 0 0 16px; }
    .hero h1 span { color: var(--accent); }
    .lead { color: var(--muted); font-size: 1.15rem; margin: 0 0 28px; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; }

    .discord { background: #313338; border-radius: var(--radius); padding: 18px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35); }
    .discord-msg { display: grid; grid-template-columns: 40px 1fr; gap: 12px; }
    .discord-msg + .discord-msg { margin-top: 14px; }
    .discord-msg img { border-radius: 50%; }
    .discord-name { font-weight: 600; color: #f2f3f5; }
    .discord-name small { background: #5865f2; color: #fff; font-size: 0.65rem; font-weight: 700; padding: 1px 5px; border-radius: 4px; margin-left: 6px; vertical-align: 2px; }
    .embed { margin-top: 6px; background: #2b2d31; border-left: 4px solid var(--c); border-radius: 4px; padding: 10px 14px; max-width: 440px; }
    .embed-author { font-size: 0.8rem; font-weight: 600; color: #f2f3f5; }
    .embed-title { font-weight: 600; color: #00a8fc; overflow-wrap: anywhere; font-size: 0.95rem; }
    .embed-foot { font-size: 0.72rem; color: #b5bac1; margin-top: 6px; }

    section { padding: 40px 0; }
    section h2 { font-size: 1.8rem; margin: 0 0 8px; }
    .section-lead { color: var(--muted); margin: 0 0 24px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }
    .card h3 { margin: 0 0 6px; font-size: 1.1rem; }
    .card p { margin: 0; color: var(--muted); }
    .step { font-weight: 800; color: var(--accent); font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; }
    .cmd { font: 700 1.05rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--accent); margin: 0 0 6px; }
    .cmd span { color: var(--muted); font-weight: 400; }
    .badge { display: inline-block; font-size: 0.75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--card); color: var(--muted); margin-top: 10px; }
    .src { border-left: 4px solid var(--c); }

    .cta { text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px 20px; margin: 40px 0 56px; }
    .cta h2 { margin-top: 0; }

    /* Pages Markdown (conditions, confidentialité) */
    .doc { max-width: 780px; margin: 0 auto; padding: 40px 20px 64px; }
    .doc h1 { font-size: 2.1rem; line-height: 1.2; }
    .doc h2 { margin-top: 2em; font-size: 1.35rem; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .doc table { display: block; overflow-x: auto; border-collapse: collapse; font-size: 0.92rem; margin: 1em 0; }
    .doc th, .doc td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; vertical-align: top; }
    .doc th { background: var(--surface); }

    footer { border-top: 1px solid var(--border); color: var(--muted); font-size: 0.9rem; }
    footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 22px; padding-bottom: 22px; }
    footer nav { display: flex; gap: 18px; flex-wrap: wrap; }
    footer a { color: var(--muted); }

    @media (max-width: 820px) {
      .hero { grid-template-columns: 1fr; padding-top: 32px; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#contenu">Aller au contenu</a>
  <div class="tricolore" aria-hidden="true"></div>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/"><img src="/assets/avatar.png" alt="" width="40" height="40">SousTitreFR</a>
      <nav class="site-nav" aria-label="Navigation principale">
        <a href="/#commandes">Commandes</a>
        <a href="/#sources">Sources</a>
        <a href="/conditions/"{% if page.url == "/conditions/" %} aria-current="page"{% endif %}>Conditions</a>
        <a href="/confidentialite/"{% if page.url == "/confidentialite/" %} aria-current="page"{% endif %}>Confidentialité</a>
      </nav>
    </div>
  </header>

  <main id="contenu">
    {% if page.url == "/" %}{{ content }}{% else %}<article class="doc">{{ content }}</article>{% endif %}
  </main>

  <footer>
    <div class="wrap">
      <span>SousTitreFR n'est pas affilié à Discord, Addic7ed, Sous-titres.eu ni OpenSubtitles.</span>
      <nav aria-label="Liens légaux">
        <a href="/conditions/">Conditions d'utilisation</a>
        <a href="/confidentialite/">Confidentialité</a>
        <a href="https://github.com/SousTitreFR/SousTitreFR.github.io/issues">Contact</a>
      </nav>
    </div>
  </footer>
</body>
</html>
